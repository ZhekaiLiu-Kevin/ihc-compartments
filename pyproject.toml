[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ihc-compartments"
version = "1.0.0"
description = "Nuclear and perinuclear stain quantification on a reproducible synthetic IHC field"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "pandas>=2.1,<3",
    "Pillow>=10,<14",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<8"]

[project.scripts]
ihc-compartments = "ihc_demo.cli:main"

[tool.setuptools]
packages = ["ihc_demo"]
